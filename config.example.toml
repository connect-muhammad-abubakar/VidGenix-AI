[app]
# Options: "all", "pexels", "pixabay", "coverr", "mixkit"
video_source = "all"

# API Keys (Multiple keys supported for rate-limit rotation)
pexels_api_keys = []
pixabay_api_keys = []
coverr_api_key = []

# LLM Provider
llm_provider = "gemini"
gemini_api_key = ""
gemini_model_name = "gemini-2.0-flash"

# Core Application Settings
hide_config = false
edge_tts_timeout = 30
tls_verify = true
max_concurrent_tasks = 5

# Storage & Subtitles
material_directory = "cache_videos"
subtitle_provider = "edge"

[whisper]
model_size = "large-v3"
device = "CPU"
compute_type = "int8"

[ui]
language = "en"
hide_log = false
tts_server = "azure-tts-v1"
voice_name = "en-US-RogerNeural-Male"
font_name = "MicrosoftYaHeiBold.ttc"
subtitle_position = "bottom"
text_fore_color = "#FFFFFF"
font_size = 43
